<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-label="Eight schematic terminal states A through H">
  <style>
    .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.floor{fill:#2d9d5b}.rim{fill:#2d9d5b}.cube{fill:#2871dc;stroke:#164a9d;stroke-width:2}.red{fill:#df4b40;stroke:#9e2828;stroke-width:2}.letter{font:700 22px sans-serif;fill:#111827}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#tip)}.grip{stroke:#475569;stroke-width:6;fill:none}
  </style>
  <defs>
    <g id="socket"><rect class="floor" x="44" y="132" width="144" height="11"/><rect class="rim" x="35" y="106" width="10" height="37"/><rect class="rim" x="188" y="106" width="10" height="37"/></g>
    <g id="blue"><rect class="cube" x="99" y="92" width="42" height="40"/></g>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#334155"/></marker>
  </defs>
  <g transform="translate(0,0)"><rect class="panel" x="8" y="8" width="464" height="164" rx="8"/><text class="letter" x="24" y="40">A</text><use href="#socket" x="115" y="12"/><use href="#blue" x="115" y="12"/></g>
  <g transform="translate(480,0)"><rect class="panel" x="8" y="8" width="464" height="164" rx="8"/><text class="letter" x="24" y="40">B</text><use href="#socket" x="115" y="12"/><rect class="red" x="214" y="104" width="42" height="40"/><use href="#blue" x="115" y="-28"/></g>
  <g transform="translate(0,180)"><rect class="panel" x="8" y="8" width="464" height="164" rx="8"/><text class="letter" x="24" y="40">C</text><use href="#socket" x="115" y="12"/><use href="#blue" x="158" y="12"/></g>
  <g transform="translate(480,180)"><rect class="panel" x="8" y="8" width="464" height="164" rx="8"/><text class="letter" x="24" y="40">D</text><use href="#socket" x="115" y="12"/><use href="#blue" x="185" y="-14"/></g>
  <g transform="translate(0,360)"><rect class="panel" x="8" y="8" width="464" height="164" rx="8"/><text class="letter" x="24" y="40">E</text><use href="#socket" x="115" y="12"/><use href="#blue" x="115" y="-22"/><path class="grip" d="M209 42v34h17 M256 42v34h-17"/></g>
  <g transform="translate(480,360)"><rect class="panel" x="8" y="8" width="464" height="164" rx="8"/><text class="letter" x="24" y="40">F</text><use href="#socket" x="115" y="12"/><rect class="cube" x="213" y="103" width="42" height="40" transform="rotate(-18 234 123)"/></g>
  <g transform="translate(0,540)"><rect class="panel" x="8" y="8" width="464" height="164" rx="8"/><text class="letter" x="24" y="40">G</text><use href="#socket" x="115" y="12"/><use href="#blue" x="115" y="-2"/></g>
  <g transform="translate(480,540)"><rect class="panel" x="8" y="8" width="464" height="164" rx="8"/><text class="letter" x="24" y="40">H</text><use href="#socket" x="115" y="12"/><use href="#blue" x="115" y="12"/><path class="arrow" d="M263 116h59"/></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480">
<style>.panel{fill:#fff;stroke:#bbb}.label{font:700 18px sans-serif;fill:#111}.small{font:12px sans-serif;fill:#333}.table{stroke:#777;stroke-width:3}.target{fill:none;stroke:#08ae37;stroke-width:5}.blue{fill:#245fe8;stroke:#1543a6;stroke-width:1}.red{fill:#e34030;stroke:#a92019;stroke-width:1}.ghost{fill:none;stroke:#245fe8;stroke-width:2;stroke-dasharray:5 4}.grip{fill:#aaa;stroke:#555}</style>
